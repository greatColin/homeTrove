[project]
name = "hometrove"
version = "0.1.0"
description = "HomeTrove / family media library with pluggable analyzers (M0 skeleton)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "HomeTrove contributors" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "av>=13",
    "scenedetect>=0.6.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
hometrove = "hometrove.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hometrove"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hometrove.plugins]
# M0: only the basic.info plugin is built in.
basic.info = "hometrove.plugins.builtin.basic_info:BasicInfoPlugin"
